<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Школьные консультации</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#3b5bdb;--bd:#e1e4ec;--ok:#2b8a3e;--no:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa2b5;--ac:#748ffc;--bd:#2f3545;--ok:#69db7c;--no:#ff8787}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
main{max-width:720px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:18px;margin:0}h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer;margin-top:12px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.no{background:var(--no)}
.badge{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.pending{color:var(--mut)}.accepted{color:var(--ok)}.declined{color:var(--no)}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:14px}.err{color:var(--no);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header><h1>📚 Школьные консультации</h1><div id="user"></div></header>
<main id="app"></main>

<script>
// ВСТАВЬТЕ СВОИ ДАННЫЕ из Supabase → Project Settings → API
const SUPABASE_URL = "https://uyormjiksmuzcudmikay.supabase.co";
const SUPABASE_KEY = "sb_publishable_JoAWTK_ZvWxiHtC7WLz5-w_087CL8dN";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {pending:"Ожидает", accepted:"Принято", declined:"Отклонено"};
let me = null, signup = false;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showAuth();
  const { data } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (!data) { await db.auth.signOut(); return showAuth(); }
  me = data;
  $("#user").innerHTML = `${esc(me.full_name)} <button class="sec" onclick="logout()" style="margin:0 0 0 8px">Выйти</button>`;
  me.role === "teacher" ? showTeacher() : showStudent();
}

function showAuth(msg = "") {
  $("#user").innerHTML = "";
  $("#app").innerHTML = `<div class="card"><h2>${signup ? "Регистрация ученика" : "Вход"}</h2>
    ${signup ? `<label>Имя и фамилия</label><input id="name"><label>Класс (например, 9Б)</label><input id="cls">` : ""}
    <label>Email</label><input id="email" type="email">
    <label>Пароль (от 6 символов)</label><input id="pass" type="password">
    <button onclick="auth()">${signup ? "Зарегистрироваться" : "Войти"}</button>
    <button class="sec" onclick="signup=!signup;showAuth()">${signup ? "У меня есть аккаунт" : "Создать аккаунт"}</button>
    <div class="err">${esc(msg)}</div></div>`;
}

async function auth() {
  const email = $("#email").value.trim(), password = $("#pass").value;
  if (signup) {
    const name = $("#name").value.trim(), cls = $("#cls").value.trim();
    if (!name) return showAuth("Введите имя");
    const { data, error } = await db.auth.signUp({ email, password });
    if (error) return showAuth(error.message);
    if (!data.session) return showAuth("Подтвердите email (или отключите подтверждение в Supabase).");
    const { error: e2 } = await db.from("profiles").insert({ id: data.user.id, full_name: name, class: cls, role: "student" });
    if (e2) return showAuth(e2.message);
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) return showAuth("Неверный email или пароль");
  }
  init();
}
async function logout() { await db.auth.signOut(); me = null; showAuth(); }

/* ---------- Ученик ---------- */
async function showStudent() {
  const { data: teachers } = await db.from("profiles").select("id,full_name").eq("role", "teacher").order("full_name");
  $("#app").innerHTML = `<div class="card"><h2>Новый запрос</h2>
    <label>Учитель</label><select id="t">${(teachers||[]).map(t => `<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select>
    <div class="row"><div><label>Предмет</label><input id="subj"></div><div><label>Тема</label><input id="topic"></div></div>
    <label>Что именно не понятно?</label><textarea id="msg" rows="3"></textarea>
    <button onclick="sendReq()">Отправить</button><div class="err" id="e"></div></div>
    <h2>Мои запросы</h2><div id="list"></div>`;
  loadStudent();
}
async function sendReq() {
  const r = { student_id: me.id, teacher_id: $("#t").value, subject: $("#subj").value.trim(), topic: $("#topic").value.trim(), message: $("#msg").value.trim() };
  if (!r.teacher_id || !r.subject || !r.topic) return $("#e").textContent = "Заполните учителя, предмет и тему";
  const { error } = await db.from("requests").insert(r);
  if (error) return $("#e").textContent = error.message;
  showStudent();
}
async function loadStudent() {
  const { data } = await db.from("requests").select("*, teacher:teacher_id(full_name)").order("created_at", { ascending: false });
  $("#list").innerHTML = (data||[]).map(r => `<div class="card"><div class="top"><b>${esc(r.subject)}: ${esc(r.topic)}</b>
    <span class="badge ${r.status}">${STATUS[r.status]}</span></div>
    <div class="mut">Учитель: ${esc(r.teacher?.full_name)}</div>${r.message ? `<p>${esc(r.message)}</p>` : ""}
    ${r.status === "accepted" ? `<p class="accepted">✅ ${esc(r.meet_time)}, кабинет ${esc(r.room)}</p>` : ""}</div>`).join("") || `<p class="mut">Пока нет запросов</p>`;
}

/* ---------- Учитель ---------- */
async function showTeacher() {
  $("#app").innerHTML = `<h2>Запросы учеников</h2><div id="list"></div>`;
  const { data } = await db.from("requests").select("*, student:student_id(full_name,class)").order("created_at", { ascending: false });
  $("#list").innerHTML = (data||[]).map(r => `<div class="card"><div class="top"><b>${esc(r.subject)}: ${esc(r.topic)}</b>
    <span class="badge ${r.status}">${STATUS[r.status]}</span></div>
    <div class="mut">${esc(r.student?.full_name)}, ${esc(r.student?.class)}</div>${r.message ? `<p>${esc(r.message)}</p>` : ""}
    ${r.status === "pending" ? `<div class="row"><div><label>Когда</label><input id="time-${r.id}" placeholder="Пт, 15:30"></div>
      <div><label>Кабинет</label><input id="room-${r.id}" placeholder="214"></div></div>
      <button onclick="answer('${r.id}','accepted')">Принять</button>
      <button class="no" onclick="answer('${r.id}','declined')">Отклонить</button>`
    : r.status === "accepted" ? `<p class="accepted">✅ ${esc(r.meet_time)}, кабинет ${esc(r.room)}</p>` : ""}</div>`).join("") || `<p class="mut">Запросов нет</p>`;
}
async function answer(id, status) {
  const upd = { status };
  if (status === "accepted") {
    upd.meet_time = $("#time-" + id).value.trim(); upd.room = $("#room-" + id).value.trim();
    if (!upd.meet_time || !upd.room) return alert("Укажите время и кабинет");
  }
  const { error } = await db.from("requests").update(upd).eq("id", id);
  if (error) return alert(error.message);
  showTeacher();
}

init();
</script>
</body>
</html>
